<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>极简去水印 · AI 无痕版</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: rgba(255, 255, 255, 0.88);
      --border: rgba(0, 0, 0, 0.08);
      --text: #1d1d1f;
      --muted: #86868b;
      --primary: #0071e3;
      --primary-hover: #0077ed;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      border-radius: 999px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 50;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(0, 0, 0, 0.1);
      margin: 0 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: rgba(0, 0, 0, 0.05);
    }

    .btn:disabled {
      opacity: 0.32;
      cursor: default;
    }

    .btn.active {
      background: #1d1d1f;
      color: #fff;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .ai-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(0, 113, 227, 0.08);
      color: var(--primary);
      font-weight: 500;
      white-space: nowrap;
    }

    .ai-badge.ready {
      background: rgba(16, 185, 129, 0.12);
      color: #059669;
    }

    .brush-slider {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .brush-slider.visible {
      display: inline-flex;
    }

    .brush-slider input[type="range"] {
      width: 72px;
      accent-color: #1d1d1f;
      cursor: pointer;
    }

    .viewport {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .canvas-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      flex-shrink: 0;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      border-radius: 6px;
      overflow: hidden;
      transform-origin: center center;
      background: #fff;
    }

    canvas {
      display: block;
    }

    #maskCanvas, #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #maskCanvas {
      opacity: 0.5;
    }

    #interactionLayer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .empty-card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(460px, 90vw);
      background: #ffffff;
      border: 1.5px dashed rgba(0, 0, 0, 0.14);
      border-radius: 20px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .empty-card:hover, .empty-card.dragover {
      border-color: var(--primary);
      transform: translate(-50%, -50%) scale(1.01);
    }

    .empty-card.hidden {
      display: none;
    }

    .empty-title {
      font-size: 18px;
      font-weight: 600;
      margin-top: 14px;
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    .bottom-hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--muted);
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 40;
    }

    .bottom-hint.visible {
      display: inline-flex;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(4px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 30;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: #1d1d1f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .toast {
      position: fixed;
      bottom: 56px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(29, 29, 31, 0.92);
      color: #fff;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <input type="file" id="fileInput" accept="image/*" style="display: none;" />

  <div class="topbar">
    <button class="btn" onclick="document.getElementById('fileInput').click()">📂 打开图片</button>

    <div class="divider"></div>

    <button class="btn active" id="toolRect" onclick="setTool('rect')">🔲 框选消除</button>
    <button class="btn" id="toolBrush" onclick="setTool('brush')">🖌️ 涂抹消除</button>

    <div class="brush-slider" id="brushSliderBox">
      <span>粗细</span>
      <input type="range" id="brushSize" min="8" max="100" value="28" oninput="brushSize = +this.value" />
    </div>

    <div class="divider"></div>

    <button class="btn" id="undoBtn" onclick="undoImage()" disabled title="Ctrl+Z">↩ 撤销</button>
    <button class="btn" id="compareBtn" onmousedown="startCompare()" onmouseup="stopCompare()" onmouseleave="stopCompare()" ontouchstart="startCompare()" ontouchend="stopCompare()" disabled>👁 按住对比</button>

    <div class="divider"></div>

    <button class="btn" id="copyBtn" onclick="copyResult()" disabled title="Ctrl+C">📋 复制</button>
    <button class="btn btn-primary" id="downloadBtn" onclick="downloadResult()" disabled>💾 保存</button>

    <span class="ai-badge" id="aiBadge">⏳ 准备 AI 引擎...</span>
  </div>

  <div class="viewport" id="viewport">
    <div class="empty-card" id="emptyCard" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 42px;">✨</div>
      <div class="empty-title">点击选择图片，或直接拖入 / Ctrl+V 粘贴</div>
      <div class="empty-sub">搭载 AI LaMa 深度学习无痕修复，框选或涂抹水印松手自动消除</div>
      <div style="display: flex; justify-content: center; gap: 10px;" onclick="event.stopPropagation()">
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">选择本地图片</button>
        <button class="btn" style="background: rgba(0,0,0,0.05);" onclick="loadDemoImage()">试试示例图</button>
      </div>
    </div>

    <div class="canvas-wrapper" id="canvasWrapper" style="display: none;">
      <canvas id="imageCanvas"></canvas>
      <canvas id="maskCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="interactionLayer"></div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-size: 13px; font-weight: 500; color: #1d1d1f;" id="loadingMsg">AI 正在无痕消除水印...</div>
      </div>
    </div>

    <div class="bottom-hint" id="bottomHint">
      <span>鼠标左键拉框/涂抹即自动去水印</span>
      <span>·</span>
      <span>滚轮缩放 (<b id="zoomText">100%</b>)</span>
      <span>·</span>
      <span>右键拖动平移</span>
      <span>·</span>
      <a href="javascript:void(0)" onclick="resetZoom()" style="color: var(--primary); text-decoration: none;">重置视图</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const imageCanvas = document.getElementById('imageCanvas');
    const maskCanvas = document.getElementById('maskCanvas');
    const overlayCanvas = document.getElementById('overlayCanvas');
    const interactionLayer = document.getElementById('interactionLayer');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const viewport = document.getElementById('viewport');
    const emptyCard = document.getElementById('emptyCard');
    const bottomHint = document.getElementById('bottomHint');
    const aiBadge = document.getElementById('aiBadge');
    const loadingMsg = document.getElementById('loadingMsg');

    const imgCtx = imageCanvas.getContext('2d');
    const maskCtx = maskCanvas.getContext('2d');
    const overlayCtx = overlayCanvas.getContext('2d');

    let currentTool = 'rect';
    let brushSize = 28;
    let isDrawing = false;
    let isPanning = false;
    let startX = 0, startY = 0, lastX = 0, lastY = 0;
    let panStartX = 0, panStartY = 0;
    let zoom = 1, panX = 0, panY = 0;

    let originalImage = null;
    let historyStack = [];
    let isProcessing = false;

    // Engine state: either local Python server OR browser ONNX Runtime Web LaMa session
    let backendBaseUrl = null;
    let ortSession = null;
    let ortInitPromise = null;

    const MODEL_URLS = [
      'https://hf-mirror.com/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx',
      'https://huggingface.co/Carve/LaMa-ONNX/resolve/main/lama_fp32.onnx'
    ];
    const DB_NAME = 'LaMaModelCacheDB';
    const STORE_NAME = 'models';
    const MODEL_KEY = 'lama_fp32_v1';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 2400);
    }

    // IndexedDB helpers to cache the 198MB LaMa ONNX model permanently in browser
    function openModelDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          e.target.result.createObjectStore(STORE_NAME);
        };
        req.onsuccess = (e) => resolve(e.target.result);
        req.onerror = (e) => reject(e.target.error);
      });
    }

    async function getCachedModel() {
      try {
        const db = await openModelDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const req = tx.objectStore(STORE_NAME).get(MODEL_KEY);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch {
        return null;
      }
    }

    async function saveCachedModel(buffer) {
      try {
        const db = await openModelDB();
        await new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readwrite');
          tx.objectStore(STORE_NAME).put(buffer, MODEL_KEY);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        });
      } catch {}
    }

    // Initialize AI Engine: Check local server first; if online, load LaMa ONNX in browser!
    async function initAIEngine() {
      // 1. Try same-origin or local Python backend (127.0.0.1:8765)
      const candidates = [];
      if (location.protocol.startsWith('http')) {
        candidates.push('');
      }
      candidates.push('http://127.0.0.1:8765');

      for (const base of candidates) {
        try {
          const ctrl = new AbortController();
          setTimeout(() => ctrl.abort(), 1200);
          const res = await fetch(`${base}/api/model-status`, { signal: ctrl.signal });
          if (res.ok) {
            const d = await res.json();
            if (d.ready) {
              backendBaseUrl = base;
              aiBadge.textContent = '✨ AI 无痕引擎已就绪';
              aiBadge.classList.add('ready');
              return;
            }
          }
        } catch {}
      }

      // 2. Pure Online Mode: Load real LaMa ONNX model in Browser via ONNX Runtime Web!
      if (!ortInitPromise) {
        ortInitPromise = loadBrowserLaMaSession();
      }
      await ortInitPromise;
    }

    async function loadBrowserLaMaSession() {
      try {
        ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
        ort.env.wasm.numThreads = Math.min(4, navigator.hardwareConcurrency || 2);

        let modelBuffer = await getCachedModel();
        if (!modelBuffer || modelBuffer.byteLength < 50 * 1024 * 1024) {
          aiBadge.textContent = '⏳ 首次下载 AI 模型 0%...';
          let downloaded = false;
          for (const url of MODEL_URLS) {
            try {
              const res = await fetch(url);
              if (!res.ok) continue;
              const total = parseInt(res.headers.get('Content-Length') || '208044816', 10);
              const reader = res.body.getReader();
              const chunks = [];
              let received = 0;
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.byteLength;
                const pct = Math.min(99, Math.round((received * 100) / total));
                aiBadge.textContent = `⏳ 首次加载 AI 引擎 ${pct}%`;
                if (isProcessing) {
                  loadingMsg.textContent = `首次加载 AI 无痕模型 (${pct}%)，加载后永久缓存...`;
                }
              }
              const merged = new Uint8Array(received);
              let offset = 0;
              for (const c of chunks) {
                merged.set(c, offset);
                offset += c.byteLength;
              }
              if (merged.byteLength > 50 * 1024 * 1024) {
                modelBuffer = merged.buffer;
                await saveCachedModel(modelBuffer);
                downloaded = true;
                break;
              }
            } catch (e) {
              console.warn('Model URL failed:', url, e);
            }
          }
          if (!downloaded) throw new Error('AI 模型下载失败，请检查网络');
        } else {
          aiBadge.textContent = '⏳ 正在初始化 AI 引擎...';
        }

        ortSession = await ort.InferenceSession.create(modelBuffer, {
          executionProviders: ['wasm'],
          graphOptimizationLevel: 'all'
        });

        aiBadge.textContent = '✨ AI 无痕引擎已就绪';
        aiBadge.classList.add('ready');
      } catch (err) {
        aiBadge.textContent = '⚠️ AI 引擎加载失败';
        console.error(err);
      }
    }

    initAIEngine();

    function setTool(tool) {
      currentTool = tool;
      document.getElementById('toolRect').classList.toggle('active', tool === 'rect');
      document.getElementById('toolBrush').classList.toggle('active', tool === 'brush');
      document.getElementById('brushSliderBox').classList.toggle('visible', tool === 'brush');
      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
    }

    function loadImageFromElement(img) {
      const w = img.naturalWidth || img.width;
      const h = img.naturalHeight || img.height;

      imageCanvas.width = w;
      imageCanvas.height = h;
      maskCanvas.width = w;
      maskCanvas.height = h;
      overlayCanvas.width = w;
      overlayCanvas.height = h;

      canvasWrapper.style.width = w + 'px';
      canvasWrapper.style.height = h + 'px';

      imgCtx.drawImage(img, 0, 0);
      maskCtx.clearRect(0, 0, w, h);
      overlayCtx.clearRect(0, 0, w, h);

      originalImage = img;
      historyStack = [imageCanvas.toDataURL('image/png')];
      updateButtons();

      emptyCard.classList.add('hidden');
      canvasWrapper.style.display = 'block';
      bottomHint.classList.add('visible');

      requestAnimationFrame(() => resetZoom());
    }

    function resetZoom() {
      if (!imageCanvas.width) return;
      const vw = Math.max(200, viewport.clientWidth - 80);
      const vh = Math.max(200, viewport.clientHeight - 140);
      zoom = Math.min(1, vw / imageCanvas.width, vh / imageCanvas.height);
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function applyTransform() {
      canvasWrapper.style.transform = `translate(calc(-50% + ${panX}px), calc(-50% + ${panY}px)) scale(${zoom})`;
      document.getElementById('zoomText').textContent = `${Math.round(zoom * 100)}%`;
    }

    window.addEventListener('resize', () => {
      if (imageCanvas.width && panX === 0 && panY === 0) resetZoom();
    });

    function loadDemoImage() {
      const w = 1024, h = 640;
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');

      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.7);
      sky.addColorStop(0, '#2c3e70');
      sky.addColorStop(0.55, '#c86d6b');
      sky.addColorStop(1, '#f4c17b');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = 'rgba(255, 245, 210, 0.9)';
      ctx.beginPath();
      ctx.arc(w * 0.72, h * 0.32, 42, 0, Math.PI * 2);
      ctx.fill();

      const lake = ctx.createLinearGradient(0, h * 0.65, 0, h);
      lake.addColorStop(0, '#7c5869');
      lake.addColorStop(1, '#1e2942');
      ctx.fillStyle = lake;
      ctx.fillRect(0, h * 0.65, w, h * 0.35);

      ctx.fillStyle = 'rgba(20, 24, 34, 0.62)';
      ctx.fillRect(w - 280, h - 76, 250, 50);
      ctx.fillStyle = '#ff5f55';
      ctx.beginPath();
      ctx.arc(w - 252, h - 51, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('PHOTO STUDIO', w - 226, h - 54);
      ctx.font = '12px sans-serif';
      ctx.fillStyle = '#d8e2ff';
      ctx.fillText('ID: @WATERMARK_DEMO', w - 226, h - 36);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.fillRect(28, 26, 210, 38);
      ctx.fillStyle = '#1e232d';
      ctx.font = 'bold 14px monospace';
      ctx.fillText('REC 2026-11-03 14:30', 42, 50);

      const img = new Image();
      img.onload = () => {
        loadImageFromElement(img);
        showToast('在水印上拉个框即可自动无痕消除');
      };
      img.src = c.toDataURL('image/png');
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      if (e.target.files[0]) readImageFile(e.target.files[0]);
      e.target.value = '';
    });

    function readImageFile(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => loadImageFromElement(img);
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.addEventListener('paste', (e) => {
      const items = e.clipboardData?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.startsWith('image/')) {
          readImageFile(item.getAsFile());
          return;
        }
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      emptyCard.classList.add('dragover');
    });
    window.addEventListener('dragleave', () => emptyCard.classList.remove('dragover'));
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      emptyCard.classList.remove('dragover');
      if (e.dataTransfer.files?.[0]) readImageFile(e.dataTransfer.files[0]);
    });

    function getCanvasCoords(e) {
      const rect = interactionLayer.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (imageCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (imageCanvas.height / rect.height);
      return {
        x: Math.max(0, Math.min(imageCanvas.width, x)),
        y: Math.max(0, Math.min(imageCanvas.height, y))
      };
    }

    interactionLayer.addEventListener('contextmenu', e => e.preventDefault());

    interactionLayer.addEventListener('mousedown', (e) => {
      if (isProcessing || !imageCanvas.width) return;
      if (e.button === 1 || e.button === 2) {
        isPanning = true;
        panStartX = e.clientX - panX;
        panStartY = e.clientY - panY;
        return;
      }
      if (e.button !== 0) return;

      isDrawing = true;
      const { x, y } = getCanvasCoords(e);
      startX = lastX = x;
      startY = lastY = y;

      if (currentTool === 'brush') {
        drawBrushStroke(x, y, x, y);
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isPanning) {
        panX = e.clientX - panStartX;
        panY = e.clientY - panStartY;
        applyTransform();
        return;
      }
      if (!imageCanvas.width) return;
      const { x, y } = getCanvasCoords(e);

      overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
      if (currentTool === 'brush') {
        overlayCtx.beginPath();
        overlayCtx.arc(x, y, brushSize / 2, 0, Math.PI * 2);
        overlayCtx.strokeStyle = '#ff3b30';
        overlayCtx.lineWidth = Math.max(1.5, 2 / zoom);
        overlayCtx.stroke();
      }

      if (!isDrawing) return;

      if (currentTool === 'rect') {
        const rx = Math.min(startX, x);
        const ry = Math.min(startY, y);
        const rw = Math.abs(x - startX);
        const rh = Math.abs(y - startY);
        overlayCtx.fillStyle = 'rgba(255, 59, 48, 0.35)';
        overlayCtx.strokeStyle = '#ff3b30';
        overlayCtx.lineWidth = Math.max(1.5, 2 / zoom);
        overlayCtx.fillRect(rx, ry, rw, rh);
        overlayCtx.strokeRect(rx, ry, rw, rh);
      } else if (currentTool === 'brush') {
        drawBrushStroke(lastX, lastY, x, y);
        lastX = x;
        lastY = y;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isPanning) {
        isPanning = false;
        return;
      }
      if (!isDrawing) return;
      isDrawing = false;

      const { x, y } = getCanvasCoords(e);
      if (currentTool === 'rect') {
        const rx = Math.min(startX, x);
        const ry = Math.min(startY, y);
        const rw = Math.abs(x - startX);
        const rh = Math.abs(y - startY);
        overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        if (rw > 3 && rh > 3) {
          maskCtx.fillStyle = '#ff3b30';
          maskCtx.fillRect(rx, ry, rw, rh);
        } else {
          return;
        }
      }
      runInpaint();
    });

    viewport.addEventListener('wheel', (e) => {
      if (!imageCanvas.width) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.89;
      zoom = Math.max(0.1, Math.min(6, zoom * factor));
      applyTransform();
    }, { passive: false });

    function drawBrushStroke(x1, y1, x2, y2) {
      maskCtx.save();
      maskCtx.beginPath();
      maskCtx.lineCap = 'round';
      maskCtx.lineJoin = 'round';
      maskCtx.lineWidth = brushSize;
      maskCtx.strokeStyle = '#ff3b30';
      maskCtx.moveTo(x1, y1);
      maskCtx.lineTo(x2, y2);
      maskCtx.stroke();
      maskCtx.restore();
    }

    function updateButtons() {
      const hasImg = !!imageCanvas.width;
      document.getElementById('undoBtn').disabled = historyStack.length <= 1 || isProcessing;
      document.getElementById('compareBtn').disabled = historyStack.length <= 1;
      document.getElementById('copyBtn').disabled = !hasImg;
      document.getElementById('downloadBtn').disabled = !hasImg;
    }

    function getBinaryMaskBlob() {
      return new Promise((resolve) => {
        const tmp = document.createElement('canvas');
        tmp.width = maskCanvas.width;
        tmp.height = maskCanvas.height;
        const tctx = tmp.getContext('2d');
        const srcData = maskCtx.getImageData(0, 0, tmp.width, tmp.height);
        const dstData = tctx.createImageData(tmp.width, tmp.height);
        for (let i = 0; i < srcData.data.length; i += 4) {
          const val = srcData.data[i + 3] > 25 ? 255 : 0;
          dstData.data[i] = val;
          dstData.data[i + 1] = val;
          dstData.data[i + 2] = val;
          dstData.data[i + 3] = 255;
        }
        tctx.putImageData(dstData, 0, 0);
        tmp.toBlob(resolve, 'image/png');
      });
    }

    // Browser-side AI LaMa 512x512 Smart Patch Inpainting (identical logic to Python InpaintEngine)
    async function inpaintBrowserLaMa() {
      if (!ortSession) {
        if (!ortInitPromise) ortInitPromise = loadBrowserLaMaSession();
        await ortInitPromise;
      }
      if (!ortSession) {
        throw new Error('AI 模型尚未就绪，请稍候重试');
      }

      const w = imageCanvas.width;
      const h = imageCanvas.height;
      const mData = maskCtx.getImageData(0, 0, w, h).data;

      let minX = w, minY = h, maxX = -1, maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (mData[(y * w + x) * 4 + 3] > 25) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return;

      // Expand bounding box by 8px dilation
      const dilate = 8;
      minX = Math.max(0, minX - dilate);
      minY = Math.max(0, minY - dilate);
      maxX = Math.min(w - 1, maxX + dilate);
      maxY = Math.min(h - 1, maxY + dilate);

      const bw = maxX - minX + 1;
      const bh = maxY - minY + 1;
      const cx = Math.floor((minX + maxX) / 2);
      const cy = Math.floor((minY + maxY) / 2);

      // Determine square context window (at least 512x512 for 1:1 native pixel resolution)
      const cropSize = Math.max(512, Math.round(Math.max(bw, bh) * 1.4));
      let x1 = cx - Math.floor(cropSize / 2);
      let y1 = cy - Math.floor(cropSize / 2);
      let x2 = x1 + cropSize;
      let y2 = y1 + cropSize;

      if (x1 < 0) { x2 -= x1; x1 = 0; }
      if (y1 < 0) { y2 -= y1; y1 = 0; }
      if (x2 > w) { x1 = Math.max(0, x1 - (x2 - w)); x2 = w; }
      if (y2 > h) { y1 = Math.max(0, y1 - (y2 - h)); y2 = h; }

      const cw = x2 - x1;
      const ch = y2 - y1;

      // Prepare 512x512 input canvases for image and dilated binary mask
      const patchImgCanvas = document.createElement('canvas');
      patchImgCanvas.width = 512;
      patchImgCanvas.height = 512;
      const patchImgCtx = patchImgCanvas.getContext('2d');
      patchImgCtx.drawImage(imageCanvas, x1, y1, cw, ch, 0, 0, 512, 512);

      const patchMaskCanvas = document.createElement('canvas');
      patchMaskCanvas.width = 512;
      patchMaskCanvas.height = 512;
      const patchMaskCtx = patchMaskCanvas.getContext('2d');
      const rDilate = Math.max(2, Math.round((dilate * 512) / Math.max(cw, ch)));
      patchMaskCtx.filter = 'blur(2px)';
      for (let dy = -rDilate; dy <= rDilate; dy += Math.max(1, Math.floor(rDilate / 2))) {
        for (let dx = -rDilate; dx <= rDilate; dx += Math.max(1, Math.floor(rDilate / 2))) {
          if (dx * dx + dy * dy <= rDilate * rDilate + 1) {
            patchMaskCtx.drawImage(maskCanvas, x1, y1, cw, ch, dx, dy, 512, 512);
          }
        }
      }
      patchMaskCtx.filter = 'none';

      const imgPixels = patchImgCtx.getImageData(0, 0, 512, 512).data;
      const maskPixels = patchMaskCtx.getImageData(0, 0, 512, 512).data;

      const imgFloat = new Float32Array(3 * 512 * 512);
      const maskFloat = new Float32Array(1 * 512 * 512);
      const planeSize = 512 * 512;

      for (let i = 0; i < planeSize; i++) {
        const p = i * 4;
        imgFloat[i] = imgPixels[p] / 255.0;
        imgFloat[planeSize + i] = imgPixels[p + 1] / 255.0;
        imgFloat[planeSize * 2 + i] = imgPixels[p + 2] / 255.0;
        maskFloat[i] = maskPixels[p + 3] > 20 ? 1.0 : 0.0;
      }

      const feeds = {
        image: new ort.Tensor('float32', imgFloat, [1, 3, 512, 512]),
        mask: new ort.Tensor('float32', maskFloat, [1, 1, 512, 512])
      };

      const results = await ortSession.run(feeds);
      const outData = results.output.data;

      let scale = 1.0;
      for (let i = 0; i < 1000; i++) {
        if (outData[i] > 1.5) { scale = 1.0; break; }
        scale = 255.0;
      }

      const outImgData = patchImgCtx.createImageData(512, 512);
      for (let i = 0; i < planeSize; i++) {
        const p = i * 4;
        const mAlpha = Math.min(1.0, maskPixels[p + 3] / 128.0); // soft feather edge
        const rRep = Math.min(255, Math.max(0, outData[i] * scale));
        const gRep = Math.min(255, Math.max(0, outData[planeSize + i] * scale));
        const bRep = Math.min(255, Math.max(0, outData[planeSize * 2 + i] * scale));

        outImgData.data[p] = rRep * mAlpha + imgPixels[p] * (1 - mAlpha);
        outImgData.data[p + 1] = gRep * mAlpha + imgPixels[p + 1] * (1 - mAlpha);
        outImgData.data[p + 2] = bRep * mAlpha + imgPixels[p + 2] * (1 - mAlpha);
        outImgData.data[p + 3] = 255;
      }
      patchImgCtx.putImageData(outImgData, 0, 0);

      // Composite repaired patch back onto original full-res image
      imgCtx.drawImage(patchImgCanvas, 0, 0, 512, 512, x1, y1, cw, ch);
    }

    async function runInpaint() {
      if (isProcessing || !imageCanvas.width) return;
      isProcessing = true;
      updateButtons();
      loadingMsg.textContent = 'AI 正在无痕消除水印...';
      document.getElementById('loadingOverlay').classList.add('active');

      try {
        if (backendBaseUrl !== null) {
          const imgBlob = await new Promise(r => imageCanvas.toBlob(r, 'image/png'));
          const maskBlob = await getBinaryMaskBlob();

          const formData = new FormData();
          formData.append('image', imgBlob, 'image.png');
          formData.append('mask', maskBlob, 'mask.png');
          formData.append('mode', 'lama');
          formData.append('dilate', '8');

          const res = await fetch(`${backendBaseUrl}/api/inpaint`, { method: 'POST', body: formData });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.detail || '处理失败');

          await new Promise((resolve) => {
            const repairedImg = new Image();
            repairedImg.onload = () => {
              imgCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
              imgCtx.drawImage(repairedImg, 0, 0);
              maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
              historyStack.push(data.image_base64);
              resolve();
            };
            repairedImg.src = data.image_base64;
          });
        } else {
          // Run true AI LaMa ONNX model directly in browser!
          await inpaintBrowserLaMa();
          maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
          historyStack.push(imageCanvas.toDataURL('image/png'));
        }
      } catch (err) {
        showToast('处理失败: ' + err.message);
        maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
      } finally {
        isProcessing = false;
        document.getElementById('loadingOverlay').classList.remove('active');
        updateButtons();
      }
    }

    function undoImage() {
      if (historyStack.length <= 1 || isProcessing) return;
      historyStack.pop();
      const img = new Image();
      img.onload = () => {
        imgCtx.clearRect(0, 0, imageCanvas.width, imageCanvas.height);
        imgCtx.drawImage(img, 0, 0);
        updateButtons();
      };
      img.src = historyStack[historyStack.length - 1];
    }

    function startCompare() {
      if (!originalImage || historyStack.length <= 1) return;
      imgCtx.drawImage(originalImage, 0, 0);
    }

    function stopCompare() {
      if (!historyStack.length) return;
      const img = new Image();
      img.onload = () => imgCtx.drawImage(img, 0, 0);
      img.src = historyStack[historyStack.length - 1];
    }

    async function copyResult() {
      if (!imageCanvas.width) return;
      try {
        const blob = await new Promise(r => imageCanvas.toBlob(r, 'image/png'));
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        showToast('已复制到剪贴板');
      } catch (e) {
        showToast('复制失败，请点击保存');
      }
    }

    function downloadResult() {
      if (!imageCanvas.width) return;
      const a = document.createElement('a');
      a.download = `clean_${Date.now()}.png`;
      a.href = imageCanvas.toDataURL('image/png');
      a.click();
    }

    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undoImage();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && imageCanvas.width) {
        e.preventDefault();
        copyResult();
      }
    });
  </script>
</body>
